workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
    scripts:
      - name: Force clean source
        script: |
          echo "=== Forcing clean source checkout ==="
          cd /Users/builder/clone
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx --exclude=".git"
          echo "=== HEAD after reset ==="
          git log --oneline -1

      - name: Verify scheme
        script: |
          echo "=== xcodebuild -list ==="
          xcodebuild -workspace ios/TradePulse.xcworkspace -list 2>&1 || true

      - name: Build and Archive
        script: |
          set -o pipefail
          ARCHIVE_PATH="/Users/builder/clone/TradePulse.xcarchive"
          LOG_FILE="/Users/builder/clone/build_full.log"
          DERIVED_DATA="/Users/builder/clone/DerivedData_fresh_$(date +%s)"

          echo "=== Using fresh DerivedData: $DERIVED_DATA ==="
          mkdir -p "$DERIVED_DATA"

          xcodebuild \
            -workspace ios/TradePulse.xcworkspace \
            -scheme TradePulse \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=5L79BW988P \
            CODE_SIGN_STYLE=Manual \
            "OTHER_LDFLAGS=-ObjC" \
            archive 2>&1 | tee "$LOG_FILE" || true

          echo ""
          echo "========================================"
          echo "=== LINKER / ERROR DETAIL (last 150) ==="
          echo "========================================"
          tail -150 "$LOG_FILE"

          [ -d "$ARCHIVE_PATH" ] && echo "ARCHIVE OK" || { echo "ARCHIVE MISSING"; exit 1; }

      - name: Export IPA
        script: |
          set -e
          ARCHIVE_PATH="/Users/builder/clone/TradePulse.xcarchive"
          IPA_PATH="/Users/builder/clone/ipa"
          mkdir -p "$IPA_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath "$IPA_PATH"
          ls -la "$IPA_PATH/"

    artifacts:
      - /Users/builder/clone/TradePulse.xcarchive
      - /Users/builder/clone/ipa/*.ipa
      - /Users/builder/clone/build_full.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
