workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
    scripts:
      - name: Extract source
        script: |
          tar -xzf ios_source.tar.gz
          ls -la ios/

      - name: Build and Archive
        script: |
          xcodebuild \
            -workspace ios/TradePulse.xcworkspace \
            -scheme TradePulse \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/TradePulse.xcarchive \
            -derivedDataPath $CM_BUILD_DIR/DerivedData_fresh_$(date +%s) \
            -allowProvisioningUpdates \
            archive

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/TradePulse.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $CM_BUILD_DIR/ipa \
            -allowProvisioningUpdates

    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
