workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
    scripts:
      - name: Build and Archive
        script: |
          cd /Users/builder/clone
          ls -la ios/
          xcodebuild \
            -workspace ios/TradePulse.xcworkspace \
            -scheme TradePulse \
            -sdk iphoneos \
            -configuration Release \
            -archivePath /Users/builder/clone/TradePulse.xcarchive \
            -derivedDataPath /Users/builder/clone/DerivedData_$(date +%s) \
            -allowProvisioningUpdates \
            archive

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath /Users/builder/clone/TradePulse.xcarchive \
            -exportOptionsPlist /Users/builder/clone/exportOptions.plist \
            -exportPath /Users/builder/clone/ipa \
            -allowProvisioningUpdates

    artifacts:
      - /Users/builder/clone/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
