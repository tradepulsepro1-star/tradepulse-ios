workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
    scripts:
      - name: Show project structure
        script: |
          echo "=== Commit info ==="
          git log --oneline -3
          echo "=== ios/ ==="
          ls -la ios/
          echo "=== Schemes ==="
          find ios -name "*.xcscheme" 2>/dev/null
          echo "=== registries.json ==="
          cat ios/TradePulse.xcworkspace/xcshareddata/swiftpm/configuration/registries.json 2>/dev/null || echo "not found"

      - name: Set manual signing + build number
        script: |
          PBXPROJ="ios/TradePulse.xcodeproj/project.pbxproj"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = 19/g" "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = 5L79BW988P;/g' "$PBXPROJ"
          echo "=== Verify signing ==="
          grep "CODE_SIGN_STYLE\|DEVELOPMENT_TEAM\|CURRENT_PROJECT_VERSION\|SDKROOT\|SUPPORTED_PLATFORMS" "$PBXPROJ" | sort -u

      - name: Resolve SPM packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios/TradePulse.xcodeproj \
            -scheme TradePulse \
            -clonedSourcePackagesDirPath $CM_BUILD_DIR/spm_cache \
            2>&1 | tail -20 || true

      - name: Build archive
        script: |
          xcodebuild archive \
            -project ios/TradePulse.xcodeproj \
            -scheme TradePulse \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $CM_BUILD_DIR/TradePulse.xcarchive \
            -clonedSourcePackagesDirPath $CM_BUILD_DIR/spm_cache \
            -disableAutomaticPackageResolution \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=5L79BW988P \
            PROVISIONING_PROFILE_SPECIFIER="trade pulse" \
            CODE_SIGN_ENTITLEMENTS=ios/Project.entitlements \
            SDKROOT=iphoneos \
            SUPPORTED_PLATFORMS=iphoneos \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/TradePulse.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $CM_BUILD_DIR/ipa \
            | xcpretty && exit ${PIPESTATUS[0]}

    artifacts:
      - $CM_BUILD_DIR/TradePulse.xcarchive
      - $CM_BUILD_DIR/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
