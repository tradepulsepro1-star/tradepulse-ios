workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
    scripts:
      - name: Force clean source
        script: |
          echo "=== Forcing clean source checkout ==="
          cd /Users/builder/clone
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx --exclude=".git"
          echo "=== HEAD after reset ==="
          git log --oneline -1
          echo "=== Verify LEANIcons removed ==="
          grep -n "LEANIcons" ios/LeanIOS/LEANTabManager.m || echo "CLEAN - LEANIcons not present"

      - name: Verify scheme
        script: |
          echo "=== Scheme ArchiveAction check ==="
          grep -c "ArchiveAction" ios/TradePulse.xcodeproj/xcshareddata/xcschemes/TradePulse.xcscheme && echo "PROJECT SCHEME OK" || echo "PROJECT SCHEME MISSING"
          echo "=== Signing settings in pbxproj ==="
          grep "DEVELOPMENT_TEAM\|CODE_SIGN_STYLE\|PROVISIONING_PROFILE_SPECIFIER\|CODE_SIGN_ENTITLEMENTS" ios/TradePulse.xcodeproj/project.pbxproj
          echo "=== xcodebuild -list ==="
          xcodebuild -workspace ios/TradePulse.xcworkspace -list 2>&1 || true

      - name: Build and Archive
        script: |
          set -o pipefail
          ARCHIVE_PATH="/Users/builder/clone/TradePulse.xcarchive"
          LOG_FILE="/Users/builder/clone/build_errors.log"

          xcodebuild \
            -workspace ios/TradePulse.xcworkspace \
            -scheme TradePulse \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=5L79BW988P \
            CODE_SIGN_STYLE=Manual \
            "OTHER_LDFLAGS=-ObjC" \
            archive 2>&1 | tee "$LOG_FILE" | \
            grep -E "error:|ARCHIVE FAILED|ARCHIVE SUCCEEDED|fatal error" || true

          echo "=== FULL ERROR SUMMARY ==="
          grep -E "^.*(error:|fatal error).*$" "$LOG_FILE" | head -40 || echo "No errors found in log"

          [ -d "$ARCHIVE_PATH" ] && echo "ARCHIVE OK" || { echo "ARCHIVE MISSING"; exit 1; }

      - name: Export IPA
        script: |
          set -e
          ARCHIVE_PATH="/Users/builder/clone/TradePulse.xcarchive"
          IPA_PATH="/Users/builder/clone/ipa"
          mkdir -p "$IPA_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath "$IPA_PATH"
          ls -la "$IPA_PATH/"

    artifacts:
      - /Users/builder/clone/TradePulse.xcarchive
      - /Users/builder/clone/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
