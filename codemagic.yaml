workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
      vars:
        XCODE_WORKSPACE: "ios/TradePulse.xcworkspace"
        XCODE_SCHEME: "TradePulse"
    scripts:
      - name: Bump build number
        script: |
          PBXPROJ="ios/TradePulse.xcodeproj/project.pbxproj"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = 59/g" "$PBXPROJ"
          echo "Xcode: $(xcodebuild -version | head -1)"

      - name: Build and Archive
        script: |
          set -o pipefail
          ARCHIVE_PATH="/Users/builder/clone/TradePulse.xcarchive"

          echo "BUILD_START"
          xcodebuild -version
          echo "WORKSPACE_LIST_START"
          xcodebuild -workspace ios/TradePulse.xcworkspace -list 2>&1
          echo "WORKSPACE_LIST_END"
          echo "PROJECT_LIST_START"
          xcodebuild -project ios/TradePulse.xcodeproj -list 2>&1
          echo "PROJECT_LIST_END"
          echo "GITIGNORE:"
          cat ios/.gitignore 2>/dev/null || echo "no gitignore"
          echo "XCUSERDATA_EXISTS:"
          ls ios/TradePulse.xcworkspace/xcuserdata/ 2>/dev/null || echo "none"
          echo "SCHEME_MGMT:"
          find ios -name "xcschememanagement.plist" -exec echo {} \; -exec cat {} \; 2>/dev/null || echo "none found"

          echo "NOW_BUILDING"
          xcodebuild \
            -workspace ios/TradePulse.xcworkspace \
            -scheme TradePulse \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=5L79BW988P \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="trade pulse" \
            "OTHER_LDFLAGS=-ObjC" \
            archive 2>&1 | head -50

          [ -d "$ARCHIVE_PATH" ] && echo "ARCHIVE OK" || { echo "ARCHIVE MISSING"; exit 1; }

      - name: Export IPA
        script: |
          set -e
          ARCHIVE_PATH="/Users/builder/clone/TradePulse.xcarchive"
          IPA_PATH="/Users/builder/clone/ipa"
          mkdir -p "$IPA_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath "$IPA_PATH"
          ls -la "$IPA_PATH/"

    artifacts:
      - /Users/builder/clone/TradePulse.xcarchive
      - /Users/builder/clone/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
