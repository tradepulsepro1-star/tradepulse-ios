workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
    scripts:
      - name: Extract source
        script: |
          tar -xzf ios_source.tar.gz
          ls -la ios/

      - name: Bump build number
        script: |
          BUILD_NUMBER=14
          echo "=== Bumping all Info.plist files to build $BUILD_NUMBER ==="
          for PLIST in $(find . -name "Info.plist" | grep -v Pods | grep -v xctest | grep -v DerivedData | grep -v ".framework"); do
            echo "Patching: $PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST" 2>/dev/null && \
              echo "  ✅ Set CFBundleVersion=$BUILD_NUMBER" || \
              echo "  ⚠️ Skipped: $PLIST"
          done
          echo "✅ Done bumping to build $BUILD_NUMBER"

      - name: Patch project for App Store distribution
        script: |
          python3 << 'PYEOF'
          import re

          with open("ios/TradePulse.xcodeproj/project.pbxproj", "r") as f:
              content = f.read()

          def patch_tradepulse_release(content):
              block_id = "6CBA40D5ECC99885AB5BD16D"
              pattern = rf'({re.escape(block_id)} /\* Release \*/ = \{{.*?buildSettings = \{{)(.*?)(\}};.*?name = Release;)'
              
              def replacer(m):
                  settings = m.group(2)
                  settings = settings.replace(
                      'CODE_SIGN_IDENTITY = "Apple Development";',
                      'CODE_SIGN_IDENTITY = "Apple Distribution";'
                  )
                  settings = settings.replace(
                      'CODE_SIGN_STYLE = Automatic;',
                      'CODE_SIGN_STYLE = Manual;'
                  )
                  settings = settings.replace(
                      'DEVELOPMENT_TEAM = "";',
                      'DEVELOPMENT_TEAM = 5L79BW988P;'
                  )
                  if 'PROVISIONING_PROFILE_SPECIFIER' not in settings:
                      settings = settings.rstrip() + '\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "trade pulse";\n\t\t\t'
                  return m.group(1) + settings + m.group(3)
              
              return re.sub(pattern, replacer, content, flags=re.DOTALL)

          content = patch_tradepulse_release(content)

          with open("ios/TradePulse.xcodeproj/project.pbxproj", "w") as f:
              f.write(content)

          print("Patched successfully")
          PYEOF

      - name: Build and Archive
        script: |
          xcodebuild \
            -workspace ios/TradePulse.xcworkspace \
            -scheme TradePulse \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/TradePulse.xcarchive \
            -allowProvisioningUpdates \
            clean archive

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/TradePulse.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $CM_BUILD_DIR/ipa \
            -allowProvisioningUpdates

    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
