workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
    scripts:
      - name: Bump build number
        script: |
          PBXPROJ="ios/TradePulse.xcodeproj/project.pbxproj"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = 19/g" "$PBXPROJ"
          echo "Build number set to 19"

      - name: Build and Archive
        script: |
          ARCHIVE_PATH="$HOME/TradePulse.xcarchive"
          echo "Archive path: $ARCHIVE_PATH"
          echo "CM_BUILD_DIR=$CM_BUILD_DIR"
          echo "HOME=$HOME"
          echo "PWD=$PWD"
          
          xcodebuild \
            -workspace ios/TradePulse.xcworkspace \
            -scheme TradePulse \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            clean archive
          
          echo "Post-archive check:"
          ls -la "$ARCHIVE_PATH" && echo "ARCHIVE OK" || echo "ARCHIVE MISSING"

      - name: Export IPA
        script: |
          ARCHIVE_PATH="$HOME/TradePulse.xcarchive"
          IPA_PATH="$HOME/ipa"
          mkdir -p "$IPA_PATH"
          
          echo "Exporting archive from: $ARCHIVE_PATH"
          ls -la "$ARCHIVE_PATH" || echo "MISSING"
          
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath "$IPA_PATH"
          
          echo "IPA files:"
          ls -la "$IPA_PATH/" || true

    artifacts:
      - $HOME/TradePulse.xcarchive
      - $HOME/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
