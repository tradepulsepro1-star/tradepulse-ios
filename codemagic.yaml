workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      xcode: 16.3
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
    scripts:
      - name: Bump build number
        script: |
          PBXPROJ="ios/TradePulse.xcodeproj/project.pbxproj"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = 20/g" "$PBXPROJ"
          echo "Xcode: $(xcodebuild -version | head -1)"

      - name: Compile GoNativeCore stub
        script: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang \
            -x objective-c \
            -target arm64-apple-ios15.5 \
            -isysroot "$SDK" \
            -I "$PWD/ios/LeanIOS" \
            -F "$SDK/System/Library/Frameworks" \
            -fobjc-arc \
            -w \
            -c ios/Frameworks/GoNativeCoreStub.m \
            -o ios/Frameworks/GoNativeCoreStub.o
          echo "Stub compiled OK"

      - name: Build and Archive
        script: |
          set -o pipefail
          ARCHIVE_PATH="/Users/builder/clone/TradePulse.xcarchive"
          STUB_OBJ="$PWD/ios/Frameworks/GoNativeCoreStub.o"
          LOG_FILE="/Users/builder/clone/build_errors.log"

          xcodebuild \
            -workspace ios/TradePulse.xcworkspace \
            -scheme TradePulse \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            "OTHER_LDFLAGS=-ObjC $STUB_OBJ" \
            clean archive 2>&1 | tee "$LOG_FILE" | \
            grep -E "error:|warning: (implicit|undeclared|unknown|redefinition|previous)|note: previous|ARCHIVE FAILED|ARCHIVE SUCCEEDED|fatal error" || true

          echo "=== FULL ERROR SUMMARY ==="
          grep -E "^.*(error:|fatal error).*$" "$LOG_FILE" | head -40 || echo "No errors found in log"

          [ -d "$ARCHIVE_PATH" ] && echo "ARCHIVE OK" || { echo "ARCHIVE MISSING"; exit 1; }

      - name: Export IPA
        script: |
          set -e
          ARCHIVE_PATH="/Users/builder/clone/TradePulse.xcarchive"
          IPA_PATH="/Users/builder/clone/ipa"
          mkdir -p "$IPA_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath "$IPA_PATH"
          ls -la "$IPA_PATH/"

    artifacts:
      - /Users/builder/clone/TradePulse.xcarchive
      - /Users/builder/clone/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
