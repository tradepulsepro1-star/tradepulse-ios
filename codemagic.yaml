workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
    scripts:
      - name: Force clean source
        script: |
          cd /Users/builder/clone
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx --exclude=".git"
          git log --oneline -1

      - name: Inject GNStubsImpl.m into project
        script: |
          set -e
          PBXPROJ="/Users/builder/clone/ios/TradePulse.xcodeproj/project.pbxproj"

          # Only inject if not already present
          if grep -q "GNStubsImpl" "$PBXPROJ"; then
            echo "GNStubsImpl already in project, skipping"
            exit 0
          fi

          echo "Injecting GNStubsImpl.m into project..."

          # Use ruby to safely edit the pbxproj
          ruby - "$PBXPROJ" <<'RUBY'
require 'xcodeproj'
project = Xcodeproj::Project.open(ARGV[0])

target = project.targets.find { |t| t.name == "TradePulse" }
raise "Target not found" unless target

group = project.main_group.find_subpath("LeanIOS", false)
raise "LeanIOS group not found" unless group

# Check if already added
existing = group.files.find { |f| f.path == "GNStubsImpl.m" }
unless existing
  file_ref = group.new_file("GNStubsImpl.m")
  target.source_build_phase.add_file_reference(file_ref)
  puts "Added GNStubsImpl.m to project and target sources"
else
  puts "GNStubsImpl.m already in group"
end

project.save
RUBY
          echo "Injection complete"

      - name: Verify scheme
        script: |
          xcodebuild -workspace ios/TradePulse.xcworkspace -list 2>&1 || true

      - name: Build and Archive
        script: |
          set -e
          ARCHIVE_PATH="/Users/builder/clone/TradePulse.xcarchive"
          DERIVED_DATA="/Users/builder/clone/DerivedData_fresh_$(date +%s)"
          mkdir -p "$DERIVED_DATA"

          xcodebuild \
            -workspace ios/TradePulse.xcworkspace \
            -scheme TradePulse \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=5L79BW988P \
            CODE_SIGN_STYLE=Manual \
            "OTHER_LDFLAGS=-ObjC" \
            archive 2>&1 | tee /Users/builder/clone/build_full.log

          [ -d "$ARCHIVE_PATH" ] && echo "ARCHIVE OK" || { echo "ARCHIVE MISSING"; exit 1; }

      - name: Export IPA
        script: |
          set -e
          xcodebuild -exportArchive \
            -archivePath /Users/builder/clone/TradePulse.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath /Users/builder/clone/ipa
          ls -la /Users/builder/clone/ipa/

    artifacts:
      - /Users/builder/clone/TradePulse.xcarchive
      - /Users/builder/clone/ipa/*.ipa
      - /Users/builder/clone/build_full.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
