workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
    scripts:
      - name: Extract source
        script: |
          tar -xzf ios_source.tar.gz
          ls -la ios/
      - name: Fix signing for Swift packages
        script: |
          cd ios
          # Remove provisioning profile enforcement from Swift package targets
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = "trade pulse";/PROVISIONING_PROFILE_SPECIFIER = "";/g' TradePulse.xcodeproj/project.pbxproj
          # Set CODE_SIGN_STYLE to Automatic for package targets only
          defaults write com.apple.dt.Xcode IDEProvisioningTeamForBundleIdentifierOverride_net.tradepulsepro 5L79BW988P || true
      - name: Build and Archive
        script: |
          xcodebuild \
            -workspace ios/TradePulse.xcworkspace \
            -scheme TradePulse \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/TradePulse.xcarchive \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=5L79BW988P \
            PROVISIONING_PROFILE_SPECIFIER="trade pulse" \
            SWIFT_PACKAGE_CODE_SIGN_STYLE=Automatic
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/TradePulse.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $CM_BUILD_DIR/ipa \
            -allowProvisioningUpdates
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
