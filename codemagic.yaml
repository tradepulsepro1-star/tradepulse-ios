workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
    scripts:
      - name: Force clean source
        script: |
          cd /Users/builder/clone
          git remote set-url origin https://github.com/tradepulsepro1-star/tradepulse-ios.git
          git fetch --all --prune
          git checkout main
          git reset --hard origin/main
          git clean -fdx --exclude=".git"
          echo "=== CURRENT COMMIT ==="
          git log --oneline -3
          echo "=== GNBridge.h CONTENT ==="
          cat ios/LeanIOS/GNBridge.h
          echo "=== LEANAppDelegate imports ==="
          head -20 ios/LeanIOS/LEANAppDelegate.m

      - name: Verify scheme
        script: |
          xcodebuild -workspace ios/TradePulse.xcworkspace -list 2>&1 || true

      - name: Build and Archive
        script: |
          set -e
          ARCHIVE_PATH="/Users/builder/clone/TradePulse.xcarchive"
          DERIVED_DATA="/Users/builder/clone/DerivedData_fresh_$(date +%s)"
          mkdir -p "$DERIVED_DATA"

          xcodebuild \
            -workspace ios/TradePulse.xcworkspace \
            -scheme TradePulse \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=5L79BW988P \
            CODE_SIGN_STYLE=Manual \
            "OTHER_LDFLAGS=-ObjC" \
            "GCC_WARN_ABOUT_DEPRECATED_FUNCTIONS=NO" \
            "CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS=NO" \
            "OTHER_CFLAGS=-Wno-deprecated-declarations -Wno-deprecated -Wno-error=deprecated-declarations" \
            "SWIFT_SUPPRESS_WARNINGS=YES" \
            archive 2>&1 | tee /Users/builder/clone/build_full.log

          echo "=== BUILD ERRORS ==="
          grep -n "error:" /Users/builder/clone/build_full.log | grep -v "^Binary" | head -40 || true

          [ -d "$ARCHIVE_PATH" ] && echo "ARCHIVE OK" || { echo "ARCHIVE MISSING"; exit 1; }

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath /Users/builder/clone/TradePulse.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath /Users/builder/clone/output \
            -allowProvisioningUpdates 2>&1

    artifacts:
      - /Users/builder/clone/output/*.ipa
      - /Users/builder/clone/build_full.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
