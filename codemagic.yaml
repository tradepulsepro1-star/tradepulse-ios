workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
    scripts:
      - name: Force clean source
        script: |
          cd /Users/builder/clone
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx --exclude=".git"
          git log --oneline -1

      - name: Inject GNStubsImpl.m into project
        script: |
          set -e
          PBXPROJ="/Users/builder/clone/ios/TradePulse.xcodeproj/project.pbxproj"

          if grep -q "GNStubsImpl" "$PBXPROJ"; then
            echo "GNStubsImpl already present, skipping"
            exit 0
          fi

          echo "Patching pbxproj with sed..."

          # 1. Add PBXFileReference (after the GoNativeJSBridgeLibrary.js reference line)
          sed -i '' 's|274A66DFC051712F0B671B3E /\* GoNativeJSBridgeLibrary.js \*/|AA11BB22CC33DD44EE55FF60 /* GNStubsImpl.m */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.objc; path = GNStubsImpl.m; sourceTree = "<group>"; };\n\t\t274A66DFC051712F0B671B3E /* GoNativeJSBridgeLibrary.js */|' "$PBXPROJ"

          # 2. Add PBXBuildFile (after the GNBackgroundAudio.m build file line)
          sed -i '' 's|0FE0155346E5661200031625 /\* GNBackgroundAudio.m in Sources \*/|AA11BB22CC33DD44EE55FF61 /* GNStubsImpl.m in Sources */ = {isa = PBXBuildFile; fileRef = AA11BB22CC33DD44EE55FF60 /* GNStubsImpl.m */; };\n\t\t0FE0155346E5661200031625 /* GNBackgroundAudio.m in Sources */|' "$PBXPROJ"

          # 3. Add to LeanIOS group children (after GoNativeJSBridgeLibrary.js in group)
          sed -i '' 's|274A66DFC051712F0B671B3E /\* GoNativeJSBridgeLibrary.js \*/,|274A66DFC051712F0B671B3E /* GoNativeJSBridgeLibrary.js */,\n\t\t\t\tAA11BB22CC33DD44EE55FF60 /* GNStubsImpl.m */,|' "$PBXPROJ"

          # 4. Add to Sources build phase (after GNBackgroundAudio.m in Sources)
          sed -i '' 's|0FE0155346E5661200031625 /\* GNBackgroundAudio.m in Sources \*/,|0FE0155346E5661200031625 /* GNBackgroundAudio.m in Sources */,\n\t\t\t\tAA11BB22CC33DD44EE55FF61 /* GNStubsImpl.m in Sources */,|' "$PBXPROJ"

          if grep -q "GNStubsImpl" "$PBXPROJ"; then
            echo "Patch successful"
          else
            echo "ERROR: patch failed — GNStubsImpl not found after sed"
            exit 1
          fi

      - name: Verify scheme
        script: |
          xcodebuild -workspace ios/TradePulse.xcworkspace -list 2>&1 || true

      - name: Build and Archive
        script: |
          set -e
          ARCHIVE_PATH="/Users/builder/clone/TradePulse.xcarchive"
          DERIVED_DATA="/Users/builder/clone/DerivedData_fresh_$(date +%s)"
          mkdir -p "$DERIVED_DATA"

          xcodebuild \
            -workspace ios/TradePulse.xcworkspace \
            -scheme TradePulse \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=5L79BW988P \
            CODE_SIGN_STYLE=Manual \
            "OTHER_LDFLAGS=-ObjC" \
            archive 2>&1 | tee /Users/builder/clone/build_full.log

          [ -d "$ARCHIVE_PATH" ] && echo "ARCHIVE OK" || { echo "ARCHIVE MISSING"; exit 1; }

      - name: Export IPA
        script: |
          set -e
          xcodebuild -exportArchive \
            -archivePath /Users/builder/clone/TradePulse.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath /Users/builder/clone/ipa
          ls -la /Users/builder/clone/ipa/

    artifacts:
      - /Users/builder/clone/TradePulse.xcarchive
      - /Users/builder/clone/ipa/*.ipa
      - /Users/builder/clone/build_full.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
