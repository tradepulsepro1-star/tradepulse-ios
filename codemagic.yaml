workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
    scripts:
      - name: Extract source
        script: |
          tar -xzf ios_source.tar.gz
          ls -la ios/

      - name: Bump build number
        script: |
          BUILD_NUMBER=18
          PLIST="ios/LeanIOS/MedianIOS-Info.plist"
          PBXPROJ="ios/TradePulse.xcodeproj/project.pbxproj"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$PLIST"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $BUILD_NUMBER/g" "$PBXPROJ"
          echo "Build number set to $BUILD_NUMBER"

      - name: Set signing
        script: |
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            ios/TradePulse.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = 5L79BW988P;/g' \
            ios/TradePulse.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = 5L79BW988P5L79BW988P;/DEVELOPMENT_TEAM = 5L79BW988P;/g' \
            ios/TradePulse.xcodeproj/project.pbxproj
          echo "Signing configured"

      - name: Install dependencies
        script: |
          cd ios
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps
          fi

      - name: Build archive
        script: |
          xcodebuild archive \
            -workspace ios/TradePulse.xcworkspace \
            -scheme TradePulse \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $CM_BUILD_DIR/TradePulse.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=5L79BW988P \
            PROVISIONING_PROFILE_SPECIFIER="trade pulse" \
            CODE_SIGN_ENTITLEMENTS=Project.entitlements \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/TradePulse.xcarchive \
            -exportOptionsPlist ios/exportOptions.plist \
            -exportPath $CM_BUILD_DIR/ipa \
            | xcpretty

    artifacts:
      - $CM_BUILD_DIR/TradePulse.xcarchive
      - $CM_BUILD_DIR/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
