workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
    scripts:
      - name: Extract source
        script: |
          tar -xzf ios_source.tar.gz
          ls -la ios/

      - name: Bump build number
        script: |
          BUILD_NUMBER=17
          MEDIAN_PLIST="ios/LeanIOS/MedianIOS-Info.plist"
          PBXPROJ="ios/TradePulse.xcodeproj/project.pbxproj"

          echo "Patching $MEDIAN_PLIST..."
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$MEDIAN_PLIST"
          echo "CFBundleVersion set to $BUILD_NUMBER"

          echo "Patching $PBXPROJ..."
          sed -i "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $BUILD_NUMBER/g" "$PBXPROJ"
          echo "CURRENT_PROJECT_VERSION set to $BUILD_NUMBER"

          grep "CFBundleVersion" "$MEDIAN_PLIST"
          grep "CURRENT_PROJECT_VERSION" "$PBXPROJ" | head -2

      - name: Add Round 1 + Round 2 native Swift plugins
        script: |
          SWIFT_DIR="ios/LeanIOS"

          # ── FaceIDManager.swift ──────────────────────────────────────────
          cat > "$SWIFT_DIR/FaceIDManager.swift" << 'SWIFT'
          import LocalAuthentication
          import WebKit
          class FaceIDManager {
              static func authenticate(webView: WKWebView, callbackName: String) {
                  let context = LAContext(); var error: NSError?
                  guard context.canEvaluatePolicy(.deviceOwnerAuthenticationWithBiometrics, error: &error) else {
                      webView.evaluateJavaScript("\(callbackName)({ success: false, error: 'Biometrics not available' })", completionHandler: nil); return
                  }
                  context.evaluatePolicy(.deviceOwnerAuthenticationWithBiometrics, localizedReason: "Authenticate to access TradePulse") { success, error in
                      DispatchQueue.main.async {
                          if success { webView.evaluateJavaScript("\(callbackName)({ success: true })", completionHandler: nil) }
                          else { webView.evaluateJavaScript("\(callbackName)({ success: false, error: '\(error?.localizedDescription ?? "Failed")' })", completionHandler: nil) }
                      }
                  }
              }
              static func checkAvailability(webView: WKWebView, callbackName: String) {
                  let context = LAContext(); var error: NSError?
                  let available = context.canEvaluatePolicy(.deviceOwnerAuthenticationWithBiometrics, error: &error)
                  var typeStr = "none"
                  if available { switch context.biometryType { case .faceID: typeStr = "faceID"; case .touchID: typeStr = "touchID"; default: typeStr = "none" } }
                  webView.evaluateJavaScript("\(callbackName)({ available: \(available), type: '\(typeStr)' })", completionHandler: nil)
              }
          }
          SWIFT

          # ── AppReviewManager.swift ───────────────────────────────────────
          cat > "$SWIFT_DIR/AppReviewManager.swift" << 'SWIFT'
          import StoreKit
          import WebKit
          class AppReviewManager {
              static func requestReview() {
                  DispatchQueue.main.async {
                      if let scene = UIApplication.shared.connectedScenes.first(where: { $0.activationState == .foregroundActive }) as? UIWindowScene {
                          SKStoreReviewController.requestReview(in: scene)
                      }
                  }
              }
          }
          SWIFT

          # ── HapticsManager.swift ─────────────────────────────────────────
          cat > "$SWIFT_DIR/HapticsManager.swift" << 'SWIFT'
          import UIKit
          class HapticsManager {
              static func impact(style: String) {
                  let s: UIImpactFeedbackGenerator.FeedbackStyle
                  switch style { case "light": s = .light; case "heavy": s = .heavy; case "soft": s = .soft; case "rigid": s = .rigid; default: s = .medium }
                  let g = UIImpactFeedbackGenerator(style: s); g.prepare(); g.impactOccurred()
              }
              static func notification(type: String) {
                  let t: UINotificationFeedbackGenerator.FeedbackType
                  switch type { case "warning": t = .warning; case "error": t = .error; default: t = .success }
                  let g = UINotificationFeedbackGenerator(); g.prepare(); g.notificationOccurred(t)
              }
              static func selection() { let g = UISelectionFeedbackGenerator(); g.prepare(); g.selectionChanged() }
          }
          SWIFT

          # ── ShareManager.swift ───────────────────────────────────────────
          cat > "$SWIFT_DIR/ShareManager.swift" << 'SWIFT'
          import UIKit
          class ShareManager {
              static func share(text: String, url: String?, viewController: UIViewController) {
                  var items: [Any] = [text]
                  if let u = url, let shareURL = URL(string: u) { items.append(shareURL) }
                  let vc = UIActivityViewController(activityItems: items, applicationActivities: nil)
                  if let pop = vc.popoverPresentationController {
                      pop.sourceView = viewController.view
                      pop.sourceRect = CGRect(x: viewController.view.bounds.midX, y: viewController.view.bounds.midY, width: 0, height: 0)
                      pop.permittedArrowDirections = []
                  }
                  viewController.present(vc, animated: true)
              }
          }
          SWIFT

          # ── CameraManager.swift ──────────────────────────────────────────
          cat > "$SWIFT_DIR/CameraManager.swift" << 'SWIFT'
          import UIKit
          import PhotosUI
          import WebKit
          class CameraManager: NSObject, PHPickerViewControllerDelegate, UIImagePickerControllerDelegate, UINavigationControllerDelegate {
              static let shared = CameraManager()
              var webView: WKWebView?; var callbackName: String?; var viewController: UIViewController?
              func pickImage(webView: WKWebView, callbackName: String, viewController: UIViewController, source: String = "library") {
                  self.webView = webView; self.callbackName = callbackName; self.viewController = viewController
                  if source == "camera" && UIImagePickerController.isSourceTypeAvailable(.camera) {
                      let picker = UIImagePickerController(); picker.sourceType = .camera; picker.delegate = self; viewController.present(picker, animated: true)
                  } else {
                      var config = PHPickerConfiguration(); config.selectionLimit = 1; config.filter = .images
                      let picker = PHPickerViewController(configuration: config); picker.delegate = self; viewController.present(picker, animated: true)
                  }
              }
              func picker(_ picker: PHPickerViewController, didFinishPicking results: [PHPickerResult]) {
                  picker.dismiss(animated: true)
                  guard let result = results.first else { callJS(base64: nil); return }
                  result.itemProvider.loadObject(ofClass: UIImage.self) { [weak self] object, _ in
                      DispatchQueue.main.async {
                          if let image = object as? UIImage, let data = image.jpegData(compressionQuality: 0.8) { self?.callJS(base64: data.base64EncodedString()) }
                          else { self?.callJS(base64: nil) }
                      }
                  }
              }
              func imagePickerController(_ picker: UIImagePickerController, didFinishPickingMediaWithInfo info: [UIImagePickerController.InfoKey: Any]) {
                  picker.dismiss(animated: true)
                  if let image = info[.originalImage] as? UIImage, let data = image.jpegData(compressionQuality: 0.8) { callJS(base64: data.base64EncodedString()) }
                  else { callJS(base64: nil) }
              }
              func imagePickerControllerDidCancel(_ picker: UIImagePickerController) { picker.dismiss(animated: true); callJS(base64: nil) }
              private func callJS(base64: String?) {
                  guard let cb = callbackName, let wv = webView else { return }
                  let js = base64 != nil ? "\(cb)({ success: true, uri: 'data:image/jpeg;base64,\(base64!)' })" : "\(cb)({ success: false })"
                  wv.evaluateJavaScript(js, completionHandler: nil)
              }
          }
          SWIFT

          # ── SignInWithAppleManager.swift ─────────────────────────────────
          cat > "$SWIFT_DIR/SignInWithAppleManager.swift" << 'SWIFT'
          import AuthenticationServices
          import WebKit
          class SignInWithAppleManager: NSObject, ASAuthorizationControllerDelegate, ASAuthorizationControllerPresentationContextProviding {
              static let shared = SignInWithAppleManager()
              var webView: WKWebView?; var callbackName: String?; var viewController: UIViewController?
              func signIn(webView: WKWebView, callbackName: String, viewController: UIViewController) {
                  self.webView = webView; self.callbackName = callbackName; self.viewController = viewController
                  let request = ASAuthorizationAppleIDProvider().createRequest()
                  request.requestedScopes = [.fullName, .email]
                  let controller = ASAuthorizationController(authorizationRequests: [request])
                  controller.delegate = self; controller.presentationContextProvider = self; controller.performRequests()
              }
              func authorizationController(controller: ASAuthorizationController, didCompleteWithAuthorization authorization: ASAuthorization) {
                  guard let credential = authorization.credential as? ASAuthorizationAppleIDCredential else { return }
                  let userId = credential.user
                  let email = credential.email ?? ""
                  let firstName = credential.fullName?.givenName ?? ""
                  let lastName = credential.fullName?.familyName ?? ""
                  let js = "\(callbackName ?? "console.log")({ success: true, userId: '\(userId)', email: '\(email)', firstName: '\(firstName)', lastName: '\(lastName)' })"
                  DispatchQueue.main.async { self.webView?.evaluateJavaScript(js, completionHandler: nil) }
              }
              func authorizationController(controller: ASAuthorizationController, didCompleteWithError error: Error) {
                  let js = "\(callbackName ?? "console.log")({ success: false, error: '\(error.localizedDescription)' })"
                  DispatchQueue.main.async { self.webView?.evaluateJavaScript(js, completionHandler: nil) }
              }
              func presentationAnchor(for controller: ASAuthorizationController) -> ASPresentationAnchor {
                  return viewController?.view.window ?? UIWindow()
              }
          }
          SWIFT

          # ── LocalNotificationsManager.swift ─────────────────────────────
          cat > "$SWIFT_DIR/LocalNotificationsManager.swift" << 'SWIFT'
          import UserNotifications
          import WebKit
          class LocalNotificationsManager {
              static func requestPermission(webView: WKWebView, callbackName: String) {
                  UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { granted, _ in
                      DispatchQueue.main.async { webView.evaluateJavaScript("\(callbackName)({ granted: \(granted) })", completionHandler: nil) }
                  }
              }
              static func scheduleNotification(id: String, title: String, body: String, delaySeconds: Double, data: String?) {
                  let content = UNMutableNotificationContent()
                  content.title = title; content.body = body; content.sound = .default
                  if let d = data { content.userInfo = ["data": d] }
                  let trigger = UNTimeIntervalNotificationTrigger(timeInterval: max(1, delaySeconds), repeats: false)
                  UNUserNotificationCenter.current().add(UNNotificationRequest(identifier: id, content: content, trigger: trigger))
              }
              static func cancelNotification(id: String) { UNUserNotificationCenter.current().removePendingNotificationRequests(withIdentifiers: [id]) }
          }
          SWIFT

          # ── ATTManager.swift ─────────────────────────────────────────────
          cat > "$SWIFT_DIR/ATTManager.swift" << 'SWIFT'
          import AppTrackingTransparency
          import WebKit
          class ATTManager {
              static func requestTracking(webView: WKWebView, callbackName: String) {
                  if #available(iOS 14, *) {
                      ATTrackingManager.requestTrackingAuthorization { status in
                          let s: String
                          switch status { case .authorized: s = "authorized"; case .denied: s = "denied"; case .restricted: s = "restricted"; default: s = "notDetermined" }
                          DispatchQueue.main.async { webView.evaluateJavaScript("\(callbackName)({ status: '\(s)' })", completionHandler: nil) }
                      }
                  } else {
                      webView.evaluateJavaScript("\(callbackName)({ status: 'authorized' })", completionHandler: nil)
                  }
              }
          }
          SWIFT

          # ── KeychainManager.swift ────────────────────────────────────────
          cat > "$SWIFT_DIR/KeychainManager.swift" << 'SWIFT'
          import Security
          import WebKit
          class KeychainManager {
              private static let service = "net.tradepulsepro"
              static func save(key: String, value: String) -> Bool {
                  let data = value.data(using: .utf8)!
                  let query: [String: Any] = [kSecClass as String: kSecClassGenericPassword, kSecAttrAccount as String: key, kSecAttrService as String: service, kSecValueData as String: data]
                  SecItemDelete(query as CFDictionary)
                  return SecItemAdd(query as CFDictionary, nil) == errSecSuccess
              }
              static func get(key: String) -> String? {
                  let query: [String: Any] = [kSecClass as String: kSecClassGenericPassword, kSecAttrAccount as String: key, kSecAttrService as String: service, kSecReturnData as String: true, kSecMatchLimit as String: kSecMatchLimitOne]
                  var result: AnyObject?
                  guard SecItemCopyMatching(query as CFDictionary, &result) == errSecSuccess, let data = result as? Data else { return nil }
                  return String(data: data, encoding: .utf8)
              }
              static func delete(key: String) {
                  let query: [String: Any] = [kSecClass as String: kSecClassGenericPassword, kSecAttrAccount as String: key, kSecAttrService as String: service]
                  SecItemDelete(query as CFDictionary)
              }
              static func saveFromJS(webView: WKWebView, key: String, value: String, callbackName: String) { webView.evaluateJavaScript("\(callbackName)({ success: \(save(key: key, value: value)) })", completionHandler: nil) }
              static func getFromJS(webView: WKWebView, key: String, callbackName: String) {
                  let value = get(key: key) ?? ""
                  webView.evaluateJavaScript("\(callbackName)({ found: \(!value.isEmpty), value: '\(value)' })", completionHandler: nil)
              }
              static func deleteFromJS(webView: WKWebView, key: String, callbackName: String) { delete(key: key); webView.evaluateJavaScript("\(callbackName)({ success: true })", completionHandler: nil) }
          }
          SWIFT

          # ════════════════════════════════════════════════════════════════
          # ROUND 2 PLUGINS
          # ════════════════════════════════════════════════════════════════

          # ── BackgroundTaskManager.swift ──────────────────────────────────
          cat > "$SWIFT_DIR/BackgroundTaskManager.swift" << 'SWIFT'
          import BackgroundTasks
          import WebKit
          class BackgroundTaskManager {
              static let refreshTaskID = "net.tradepulsepro.refresh"
              static func register() {
                  BGTaskScheduler.shared.register(forTaskWithIdentifier: refreshTaskID, using: nil) { task in
                      handleRefresh(task: task as! BGAppRefreshTask)
                  }
              }
              static func scheduleRefresh() {
                  let request = BGAppRefreshTaskRequest(identifier: refreshTaskID)
                  request.earliestBeginDate = Date(timeIntervalSinceNow: 15 * 60)
                  try? BGTaskScheduler.shared.submit(request)
              }
              private static func handleRefresh(task: BGAppRefreshTask) {
                  scheduleRefresh()
                  task.setTaskCompleted(success: true)
              }
              static func requestFromJS(webView: WKWebView, callbackName: String) {
                  scheduleRefresh()
                  webView.evaluateJavaScript("\(callbackName)({ scheduled: true })", completionHandler: nil)
              }
          }
          SWIFT

          # ── WebSocketManager.swift ───────────────────────────────────────
          cat > "$SWIFT_DIR/WebSocketManager.swift" << 'SWIFT'
          import Foundation
          import WebKit
          class WebSocketManager: NSObject, URLSessionWebSocketDelegate {
              static let shared = WebSocketManager()
              var sessions: [String: URLSessionWebSocketTask] = [:]
              var webView: WKWebView?
              func connect(id: String, url: String, webView: WKWebView) {
                  self.webView = webView
                  guard let wsURL = URL(string: url) else { return }
                  let session = URLSession(configuration: .default, delegate: self, delegateQueue: OperationQueue())
                  let task = session.webSocketTask(with: wsURL)
                  sessions[id] = task
                  task.resume()
                  receive(id: id, task: task)
                  notifyJS(event: "open", id: id, data: nil)
              }
              func send(id: String, message: String) {
                  sessions[id]?.send(.string(message)) { _ in }
              }
              func disconnect(id: String) {
                  sessions[id]?.cancel(with: .normalClosure, reason: nil)
                  sessions.removeValue(forKey: id)
                  notifyJS(event: "close", id: id, data: nil)
              }
              private func receive(id: String, task: URLSessionWebSocketTask) {
                  task.receive { [weak self] result in
                      switch result {
                      case .success(let msg):
                          switch msg {
                          case .string(let text): self?.notifyJS(event: "message", id: id, data: text)
                          default: break
                          }
                          self?.receive(id: id, task: task)
                      case .failure: self?.notifyJS(event: "error", id: id, data: nil)
                      }
                  }
              }
              private func notifyJS(event: String, id: String, data: String?) {
                  let payload = data != nil ? "'\(data!.replacingOccurrences(of: "'", with: "\\'"))'" : "null"
                  let js = "window.TradePulseNative._wsEvent('\(event)', '\(id)', \(payload))"
                  DispatchQueue.main.async { self.webView?.evaluateJavaScript(js, completionHandler: nil) }
              }
          }
          SWIFT

          # ── QRScannerManager.swift ───────────────────────────────────────
          cat > "$SWIFT_DIR/QRScannerManager.swift" << 'SWIFT'
          import AVFoundation
          import UIKit
          import WebKit
          class QRScannerManager: NSObject, AVCaptureMetadataOutputObjectsDelegate {
              static let shared = QRScannerManager()
              var captureSession: AVCaptureSession?
              var previewLayer: AVCaptureVideoPreviewLayer?
              var scannerVC: UIViewController?
              var webView: WKWebView?
              var callbackName: String?
              func startScan(webView: WKWebView, callbackName: String, viewController: UIViewController) {
                  self.webView = webView; self.callbackName = callbackName
                  let vc = UIViewController()
                  vc.view.backgroundColor = .black
                  let session = AVCaptureSession()
                  guard let device = AVCaptureDevice.default(for: .video),
                        let input = try? AVCaptureDeviceInput(device: device) else {
                      webView.evaluateJavaScript("\(callbackName)({ success: false, error: 'Camera unavailable' })", completionHandler: nil); return
                  }
                  session.addInput(input)
                  let output = AVCaptureMetadataOutput()
                  session.addOutput(output)
                  output.setMetadataObjectsDelegate(self, queue: DispatchQueue.main)
                  output.metadataObjectTypes = [.qr, .ean13, .ean8, .code128]
                  let preview = AVCaptureVideoPreviewLayer(session: session)
                  preview.frame = vc.view.bounds; preview.videoGravity = .resizeAspectFill
                  vc.view.layer.addSublayer(preview)
                  let closeBtn = UIButton(type: .system)
                  closeBtn.setTitle("Cancel", for: .normal); closeBtn.setTitleColor(.white, for: .normal)
                  closeBtn.frame = CGRect(x: 20, y: 50, width: 80, height: 40)
                  closeBtn.addTarget(self, action: #selector(cancelScan), for: .touchUpInside)
                  vc.view.addSubview(closeBtn)
                  self.captureSession = session; self.scannerVC = vc; self.previewLayer = preview
                  session.startRunning()
                  viewController.present(vc, animated: true)
              }
              func metadataOutput(_ output: AVCaptureMetadataOutput, didOutput objects: [AVMetadataObject], from connection: AVCaptureConnection) {
                  guard let obj = objects.first as? AVMetadataMachineReadableCodeObject, let value = obj.stringValue else { return }
                  captureSession?.stopRunning()
                  let js = "\(callbackName ?? "console.log")({ success: true, value: '\(value)' })"
                  scannerVC?.dismiss(animated: true) { self.webView?.evaluateJavaScript(js, completionHandler: nil) }
              }
              @objc func cancelScan() {
                  captureSession?.stopRunning()
                  scannerVC?.dismiss(animated: true) { self.webView?.evaluateJavaScript("\(self.callbackName ?? "console.log")({ success: false, cancelled: true })", completionHandler: nil) }
              }
          }
          SWIFT

          # ── ClipboardManager.swift ───────────────────────────────────────
          cat > "$SWIFT_DIR/ClipboardManager.swift" << 'SWIFT'
          import UIKit
          import WebKit
          class ClipboardManager {
              static func copy(text: String, webView: WKWebView, callbackName: String) {
                  UIPasteboard.general.string = text
                  webView.evaluateJavaScript("\(callbackName)({ success: true })", completionHandler: nil)
              }
              static func paste(webView: WKWebView, callbackName: String) {
                  let text = UIPasteboard.general.string ?? ""
                  webView.evaluateJavaScript("\(callbackName)({ value: '\(text.replacingOccurrences(of: "'", with: "\\'"))' })", completionHandler: nil)
              }
          }
          SWIFT

          # ── NativeBridge.swift (Round 1 + Round 2 — full) ────────────────
          cat > "$SWIFT_DIR/NativeBridge.swift" << 'SWIFT'
          import UIKit
          import WebKit
          class NativeBridge: NSObject, WKScriptMessageHandler {
              weak var webView: WKWebView?
              weak var viewController: UIViewController?
              init(webView: WKWebView, viewController: UIViewController) {
                  self.webView = webView; self.viewController = viewController; super.init()
              }
              func userContentController(_ userContentController: WKUserContentController, didReceive message: WKScriptMessage) {
                  guard let body = message.body as? [String: Any], let action = body["action"] as? String else { return }
                  let callback = body["callback"] as? String ?? "console.log"
                  switch action {
                  // ── ROUND 1 ──────────────────────────────────────────────
                  case "faceID.check":          if let wv = webView { FaceIDManager.checkAvailability(webView: wv, callbackName: callback) }
                  case "faceID.authenticate":   if let wv = webView { FaceIDManager.authenticate(webView: wv, callbackName: callback) }
                  case "review.request":        AppReviewManager.requestReview()
                  case "haptics.impact":        HapticsManager.impact(style: body["style"] as? String ?? "medium")
                  case "haptics.notification":  HapticsManager.notification(type: body["type"] as? String ?? "success")
                  case "haptics.selection":     HapticsManager.selection()
                  case "share.open":            if let vc = viewController { ShareManager.share(text: body["text"] as? String ?? "", url: body["url"] as? String, viewController: vc) }
                  case "camera.pick":           if let wv = webView, let vc = viewController { CameraManager.shared.pickImage(webView: wv, callbackName: callback, viewController: vc, source: body["source"] as? String ?? "library") }
                  case "apple.signIn":          if let wv = webView, let vc = viewController { SignInWithAppleManager.shared.signIn(webView: wv, callbackName: callback, viewController: vc) }
                  case "notifications.request": if let wv = webView { LocalNotificationsManager.requestPermission(webView: wv, callbackName: callback) }
                  case "notifications.schedule":
                      LocalNotificationsManager.scheduleNotification(
                          id: body["id"] as? String ?? UUID().uuidString,
                          title: body["title"] as? String ?? "TradePulse",
                          body: body["body"] as? String ?? "",
                          delaySeconds: body["delay"] as? Double ?? 1,
                          data: body["data"] as? String
                      )
                  case "notifications.cancel":  LocalNotificationsManager.cancelNotification(id: body["id"] as? String ?? "")
                  case "att.request":           if let wv = webView { ATTManager.requestTracking(webView: wv, callbackName: callback) }
                  case "keychain.save":         if let wv = webView { KeychainManager.saveFromJS(webView: wv, key: body["key"] as? String ?? "", value: body["value"] as? String ?? "", callbackName: callback) }
                  case "keychain.get":          if let wv = webView { KeychainManager.getFromJS(webView: wv, key: body["key"] as? String ?? "", callbackName: callback) }
                  case "keychain.delete":       if let wv = webView { KeychainManager.deleteFromJS(webView: wv, key: body["key"] as? String ?? "", callbackName: callback) }
                  // ── ROUND 2 ──────────────────────────────────────────────
                  case "background.schedule":   if let wv = webView { BackgroundTaskManager.requestFromJS(webView: wv, callbackName: callback) }
                  case "ws.connect":
                      if let wv = webView, let wsId = body["id"] as? String, let wsUrl = body["url"] as? String {
                          WebSocketManager.shared.connect(id: wsId, url: wsUrl, webView: wv)
                      }
                  case "ws.send":
                      if let wsId = body["id"] as? String, let msg = body["message"] as? String {
                          WebSocketManager.shared.send(id: wsId, message: msg)
                      }
                  case "ws.disconnect":
                      if let wsId = body["id"] as? String { WebSocketManager.shared.disconnect(id: wsId) }
                  case "qr.scan":               if let wv = webView, let vc = viewController { QRScannerManager.shared.startScan(webView: wv, callbackName: callback, viewController: vc) }
                  case "clipboard.copy":        if let wv = webView { ClipboardManager.copy(text: body["text"] as? String ?? "", webView: wv, callbackName: callback) }
                  case "clipboard.paste":       if let wv = webView { ClipboardManager.paste(webView: wv, callbackName: callback) }
                  default: print("[NativeBridge] Unknown action: \(action)")
                  }
              }
              static func injectedScript() -> String {
                  return """
                  window.TradePulseNative = {
                      isNative: true,
                      _wsListeners: {},
                      _wsEvent: function(event, id, data) {
                          var listeners = window.TradePulseNative._wsListeners[id];
                          if (listeners && listeners[event]) { listeners[event](data); }
                      },
                      faceID: {
                          check: function(cb) { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'faceID.check', callback: cb }); },
                          authenticate: function(cb) { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'faceID.authenticate', callback: cb }); }
                      },
                      review: {
                          request: function() { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'review.request' }); }
                      },
                      haptics: {
                          impact: function(style) { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'haptics.impact', style: style || 'medium' }); },
                          notification: function(type) { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'haptics.notification', type: type || 'success' }); },
                          selection: function() { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'haptics.selection' }); }
                      },
                      share: {
                          open: function(text, url) { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'share.open', text: text, url: url }); }
                      },
                      camera: {
                          pick: function(source, cb) { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'camera.pick', source: source || 'library', callback: cb }); }
                      },
                      apple: {
                          signIn: function(cb) { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'apple.signIn', callback: cb }); }
                      },
                      notifications: {
                          request: function(cb) { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'notifications.request', callback: cb }); },
                          schedule: function(opts) { window.webkit.messageHandlers.nativeBridge.postMessage(Object.assign({ action: 'notifications.schedule' }, opts)); },
                          cancel: function(id) { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'notifications.cancel', id: id }); }
                      },
                      att: {
                          request: function(cb) { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'att.request', callback: cb }); }
                      },
                      keychain: {
                          save: function(key, value, cb) { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'keychain.save', key: key, value: value, callback: cb }); },
                          get: function(key, cb) { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'keychain.get', key: key, callback: cb }); },
                          delete: function(key, cb) { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'keychain.delete', key: key, callback: cb }); }
                      },
                      background: {
                          schedule: function(cb) { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'background.schedule', callback: cb }); }
                      },
                      ws: {
                          connect: function(id, url, onOpen, onMessage, onClose, onError) {
                              window.TradePulseNative._wsListeners[id] = { open: onOpen, message: onMessage, close: onClose, error: onError };
                              window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'ws.connect', id: id, url: url });
                          },
                          send: function(id, message) { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'ws.send', id: id, message: message }); },
                          disconnect: function(id) { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'ws.disconnect', id: id }); }
                      },
                      qr: {
                          scan: function(cb) { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'qr.scan', callback: cb }); }
                      },
                      clipboard: {
                          copy: function(text, cb) { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'clipboard.copy', text: text, callback: cb }); },
                          paste: function(cb) { window.webkit.messageHandlers.nativeBridge.postMessage({ action: 'clipboard.paste', callback: cb }); }
                      },
                      deepLink: {
                          handle: function(url) { console.log('[DeepLink] received:', url); }
                      }
                  };
                  console.log('[TradePulse] Native bridge v3 ready — Round 1 + Round 2 plugins loaded');
                  """
              }
          }
          SWIFT

          echo "✅ All Round 1 + Round 2 Swift plugins written"
          ls -la "$SWIFT_DIR/"*.swift

      - name: Add entitlements
        script: |
          cat > ios/LeanIOS/TradePulse.entitlements << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>aps-environment</key>
              <string>production</string>
              <key>com.apple.developer.applesignin</key>
              <array>
                  <string>Default</string>
              </array>
              <key>com.apple.security.application-groups</key>
              <array>
                  <string>group.net.tradepulsepro</string>
              </array>
          </dict>
          </plist>
          EOF
          echo "✅ Entitlements written"

      - name: Add Info.plist privacy keys
        script: |
          PLIST="ios/LeanIOS/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'TradePulse uses your camera to scan QR codes and update your profile photo.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'TradePulse uses your camera to scan QR codes and update your profile photo.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'TradePulse accesses your photos to update your profile picture.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'TradePulse accesses your photos to update your profile picture.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'TradePulse uses Face ID for secure and fast authentication.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSFaceIDUsageDescription 'TradePulse uses Face ID for secure and fast authentication.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSUserTrackingUsageDescription string 'TradePulse uses tracking to personalize your trading experience and improve the app.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSUserTrackingUsageDescription 'TradePulse uses tracking to personalize your trading experience and improve the app.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :BGTaskSchedulerPermittedIdentifiers array" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :BGTaskSchedulerPermittedIdentifiers:0 string 'net.tradepulsepro.refresh'" "$PLIST" 2>/dev/null || true

          echo "✅ Privacy keys + BGTask identifier added to Info.plist"

      - name: Patch project for App Store distribution
        script: |
          python3 << 'PYEOF'
          import re
          with open("ios/TradePulse.xcodeproj/project.pbxproj", "r") as f:
              content = f.read()
          def patch_tradepulse_release(content):
              block_id = "6CBA40D5ECC99885AB5BD16D"
              pattern = rf'({re.escape(block_id)} /\* Release \*/ = \{{.*?buildSettings = \{{)(.*?)(\}};.*?name = Release;)'
              def replacer(m):
                  settings = m.group(2)
                  settings = settings.replace('CODE_SIGN_IDENTITY = "Apple Development";', 'CODE_SIGN_IDENTITY = "Apple Distribution";')
                  settings = settings.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
                  settings = settings.replace('DEVELOPMENT_TEAM = "";', 'DEVELOPMENT_TEAM = 5L79BW988P;')
                  if 'PROVISIONING_PROFILE_SPECIFIER' not in settings:
                      settings = settings.rstrip() + '\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "trade pulse";\n\t\t\t'
                  if 'CODE_SIGN_ENTITLEMENTS' not in settings:
                      settings = settings.rstrip() + '\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = LeanIOS/TradePulse.entitlements;\n\t\t\t'
                  return m.group(1) + settings + m.group(3)
              return re.sub(pattern, replacer, content, flags=re.DOTALL)
          content = patch_tradepulse_release(content)
          with open("ios/TradePulse.xcodeproj/project.pbxproj", "w") as f:
              f.write(content)
          print("✅ Project patched")
          PYEOF
          echo "Verification:"
          grep "CODE_SIGN_STYLE\|CODE_SIGN_IDENTITY\|DEVELOPMENT_TEAM\|PROVISIONING_PROFILE_SPECIFIER\|CODE_SIGN_ENTITLEMENTS" ios/TradePulse.xcodeproj/project.pbxproj

      - name: Build and Archive
        script: |
          xcodebuild \
            -workspace ios/TradePulse.xcworkspace \
            -scheme TradePulse \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/TradePulse.xcarchive \
            -allowProvisioningUpdates \
            clean archive

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/TradePulse.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $CM_BUILD_DIR/ipa \
            -allowProvisioningUpdates

    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
