workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
    scripts:
      - name: Force clean source
        script: |
          echo "=== Forcing clean source checkout ==="
          cd /Users/builder/clone
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx --exclude=".git"
          echo "=== HEAD after reset ==="
          git log --oneline -1

      - name: Verify scheme
        script: |
          echo "=== xcodebuild -list ==="
          xcodebuild -workspace ios/TradePulse.xcworkspace -list 2>&1 || true

      - name: Build and Archive
        script: |
          set -o pipefail
          ARCHIVE_PATH="/Users/builder/clone/TradePulse.xcarchive"
          LOG_FILE="/Users/builder/clone/build_errors.log"

          xcodebuild \
            -workspace ios/TradePulse.xcworkspace \
            -scheme TradePulse \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=5L79BW988P \
            CODE_SIGN_STYLE=Manual \
            "OTHER_LDFLAGS=-ObjC" \
            archive 2>&1 | tee "$LOG_FILE" | \
            grep -E "error:|warning: duplicate|Undefined symbol|ld: |linker command|ARCHIVE FAILED|ARCHIVE SUCCEEDED|clang: error" || true

          echo "=== FULL ERROR SUMMARY ==="
          grep -E "error:|Undefined symbol|ld: |duplicate symbol|clang: error" "$LOG_FILE" | head -60 || echo "No errors found in log"

          echo "=== LINKER DETAIL ==="
          grep -A3 -B1 "Undefined symbol\|duplicate symbol\|ld: warning\|ld: error\|clang: error" "$LOG_FILE" | head -80 || echo "No linker detail"

          [ -d "$ARCHIVE_PATH" ] && echo "ARCHIVE OK" || { echo "ARCHIVE MISSING"; exit 1; }

      - name: Export IPA
        script: |
          set -e
          ARCHIVE_PATH="/Users/builder/clone/TradePulse.xcarchive"
          IPA_PATH="/Users/builder/clone/ipa"
          mkdir -p "$IPA_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath "$IPA_PATH"
          ls -la "$IPA_PATH/"

    artifacts:
      - /Users/builder/clone/TradePulse.xcarchive
      - /Users/builder/clone/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
