workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
    scripts:
      - name: Extract source
        script: |
          echo "=== Files in repo ==="
          ls -la
          echo "=== File type ==="
          file ios_source.tar.gz
          echo "=== File size ==="
          du -sh ios_source.tar.gz
          echo "=== Trying tar extraction ==="
          tar -xzf ios_source.tar.gz || tar -xf ios_source.tar.gz || unzip ios_source.tar.gz || true
          echo "=== Contents after extraction ==="
          ls -la
      - name: Find Xcode project
        script: |
          echo "=== Looking for xcodeproj or xcworkspace ==="
          find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -20
          find . -name "project.pbxproj" | head -5
      - name: Fix Bundle ID
        script: |
          find . -name "project.pbxproj" | xargs sed -i '' 's/co\.median\.ios\.rdjakwd/net.tradepulsepro/g' 2>/dev/null || true
          find . -name "project.pbxproj" | xargs grep -l "PRODUCT_BUNDLE_IDENTIFIER" | head -3
      - name: Install CocoaPods
        script: |
          WORKSPACE=$(find . -name "*.xcworkspace" | grep -v "Pods" | head -1)
          WORKSPACE_DIR=$(dirname "$WORKSPACE")
          echo "Found workspace at: $WORKSPACE"
          cd "$WORKSPACE_DIR"
          pod install --repo-update
      - name: Build and Archive
        script: |
          WORKSPACE=$(find . -name "*.xcworkspace" | grep -v "Pods" | head -1)
          WORKSPACE_DIR=$(dirname "$WORKSPACE")
          WORKSPACE_NAME=$(basename "$WORKSPACE")
          echo "Building workspace: $WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme TradePulse \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/TradePulse.xcarchive \
            clean archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=5L79BW988P
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/TradePulse.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $CM_BUILD_DIR/ipa
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
