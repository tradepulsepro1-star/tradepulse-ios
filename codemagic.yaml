workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
        provisioning_profiles:
          - net.tradepulsepro
    scripts:
      - name: Extract source
        script: |
          tar -xzf ios_source.tar.gz
          ls -la ios/
      - name: Install Tuist and Generate project
        script: |
          cd ios
          if [ -f "Tuist.swift" ] || [ -f "Project.swift" ]; then
            echo "Tuist project detected"
            brew install tuist
            tuist install
            tuist generate --no-open
          else
            echo "No Tuist files found"
          fi
      - name: Build and Archive
        script: |
          xcodebuild \
            -workspace ios/TradePulse.xcworkspace \
            -scheme TradePulse \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/TradePulse.xcarchive \
            -allowProvisioningUpdates \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="trade pulse" \
            DEVELOPMENT_TEAM=5L79BW988P
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/TradePulse.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $CM_BUILD_DIR/ipa \
            -allowProvisioningUpdates
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
