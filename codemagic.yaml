workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
    scripts:
      - name: Bump build number
        script: |
          PBXPROJ="ios/TradePulse.xcodeproj/project.pbxproj"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = 19/g" "$PBXPROJ"
          echo "Build number set to 19"

      - name: Build and Archive
        script: |
          ARCHIVE_PATH="$CM_BUILD_DIR/TradePulse.xcarchive"
          echo "Archive will be saved to: $ARCHIVE_PATH"
          
          xcodebuild \
            -workspace ios/TradePulse.xcworkspace \
            -scheme TradePulse \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            clean archive
          
          echo "Archive exists check:"
          ls -la "$ARCHIVE_PATH" || echo "WARNING: Archive not found at $ARCHIVE_PATH"

      - name: Export IPA
        script: |
          ARCHIVE_PATH="$CM_BUILD_DIR/TradePulse.xcarchive"
          IPA_PATH="$CM_BUILD_DIR/ipa"
          
          echo "Exporting from: $ARCHIVE_PATH"
          ls -la "$ARCHIVE_PATH" || echo "Archive missing!"
          
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ios/exportOptions.plist \
            -exportPath "$IPA_PATH"

    artifacts:
      - $CM_BUILD_DIR/TradePulse.xcarchive
      - $CM_BUILD_DIR/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
