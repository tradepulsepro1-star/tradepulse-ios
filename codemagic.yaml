workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
    scripts:
      - name: Show project structure
        script: |
          echo "=== Root ==="
          ls -la
          echo "=== ios/ ==="
          ls -la ios/
          echo "=== xcworkspace/xcodeproj check ==="
          find ios -maxdepth 2 -name "*.xcworkspace" -o -name "*.xcodeproj" 2>/dev/null

      - name: Force add xcworkspace to git tracking
        script: |
          git rm -r --cached ios/TradePulse.xcworkspace 2>/dev/null || true
          git add -f ios/TradePulse.xcworkspace 2>/dev/null || true
          echo "xcworkspace check done"
          ls -la ios/TradePulse.xcworkspace/ 2>/dev/null || echo "xcworkspace not found - using xcodeproj"

      - name: Set manual signing + build number
        script: |
          PBXPROJ="ios/TradePulse.xcodeproj/project.pbxproj"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = 19/g" "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = 5L79BW988P;/g' "$PBXPROJ"
          echo "Done"

      - name: Build archive
        script: |
          # Try xcworkspace first, fall back to xcodeproj
          if [ -d "ios/TradePulse.xcworkspace" ]; then
            echo "Using xcworkspace"
            xcodebuild archive \
              -workspace ios/TradePulse.xcworkspace \
              -scheme TradePulse-Workspace \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath $CM_BUILD_DIR/TradePulse.xcarchive \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM=5L79BW988P \
              PROVISIONING_PROFILE_SPECIFIER="trade pulse" \
              CODE_SIGN_ENTITLEMENTS=ios/Project.entitlements \
              ONLY_ACTIVE_ARCH=NO \
              | xcpretty && exit ${PIPESTATUS[0]}
          else
            echo "Using xcodeproj"
            xcodebuild archive \
              -project ios/TradePulse.xcodeproj \
              -scheme TradePulse-Workspace \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath $CM_BUILD_DIR/TradePulse.xcarchive \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM=5L79BW988P \
              PROVISIONING_PROFILE_SPECIFIER="trade pulse" \
              CODE_SIGN_ENTITLEMENTS=ios/Project.entitlements \
              ONLY_ACTIVE_ARCH=NO \
              | xcpretty && exit ${PIPESTATUS[0]}
          fi

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/TradePulse.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $CM_BUILD_DIR/ipa \
            | xcpretty && exit ${PIPESTATUS[0]}

    artifacts:
      - $CM_BUILD_DIR/TradePulse.xcarchive
      - $CM_BUILD_DIR/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
