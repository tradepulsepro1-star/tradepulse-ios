workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      xcode: latest-stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
    scripts:
      - name: Bump build number
        script: |
          PBXPROJ="ios/TradePulse.xcodeproj/project.pbxproj"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = 19/g" "$PBXPROJ"
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "PWD=$PWD"

      - name: Build and Archive
        script: |
          set -e
          ARCHIVE_PATH="/Users/builder/clone/TradePulse.xcarchive"
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "Saving archive to: $ARCHIVE_PATH"
          
          xcodebuild \
            -workspace ios/TradePulse.xcworkspace \
            -scheme TradePulse \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            clean archive
          
          if [ -d "$ARCHIVE_PATH" ]; then
            echo "SUCCESS: Archive created at $ARCHIVE_PATH"
          else
            echo "FATAL: Archive not found after build"
            exit 1
          fi

      - name: Export IPA
        script: |
          set -e
          ARCHIVE_PATH="/Users/builder/clone/TradePulse.xcarchive"
          IPA_PATH="/Users/builder/clone/ipa"
          mkdir -p "$IPA_PATH"
          
          echo "Archive exists: $(ls -d $ARCHIVE_PATH 2>/dev/null && echo YES || echo NO)"
          
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath "$IPA_PATH"
          
          echo "IPA:"
          ls -la "$IPA_PATH/"

    artifacts:
      - /Users/builder/clone/TradePulse.xcarchive
      - /Users/builder/clone/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
