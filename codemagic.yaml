workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    environment:
      groups:
        - ios
      vars:
        XCODE_WORKSPACE: "ios/TradePulse.xcworkspace"
        XCODE_SCHEME: "TradePulse"
    scripts:
      - name: Extract source code
        script: |
          tar -xzf ios_source.tar.gz
      - name: Fix Bundle ID
        script: |
          sed -i '' 's/co\.median\.ios\.rdjakwd/net.tradepulsepro/g' ios/TradePulse.xcodeproj/project.pbxproj
          echo "Bundle ID fixed. Verifying:"
          grep "net.tradepulsepro" ios/TradePulse.xcodeproj/project.pbxproj | head -5
      - name: Build iOS
        script: |
          echo $PROVISIONING_PROFILE | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract UUID raw -)
          echo "Profile UUID: $UUID"
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          xcodebuild -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/TradePulse.xcarchive \
            DEVELOPMENT_TEAM=5L79BW988P \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE=$UUID \
            archive
          xcodebuild -exportArchive \
            -archivePath build/TradePulse.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
