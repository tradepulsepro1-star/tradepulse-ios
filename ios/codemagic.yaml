workflows:
  ios-workflow:
    name: TradePulse iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Anthony Rosa
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.tradepulsepro
    scripts:
      - name: Bump build number
        script: |
          BUILD_NUMBER=18

          # Patch pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $BUILD_NUMBER/g" TradePulse.xcodeproj/project.pbxproj

          # Verify
          grep "CURRENT_PROJECT_VERSION" TradePulse.xcodeproj/project.pbxproj | head -2
          echo "Build number set to $BUILD_NUMBER"

      - name: Set code signing
        script: |
          xcode-project use-profiles

      - name: Build and archive
        script: |
          TARGET_ID="6CBA40D5ECC99885AB5BD16D"

          xcodebuild \
            -project TradePulse.xcodeproj \
            -target LeanIOS \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=5L79BW988P \
            PROVISIONING_PROFILE_SPECIFIER="trade pulse" \
            CODE_SIGN_ENTITLEMENTS=LeanIOS/TradePulse.entitlements \
            CURRENT_PROJECT_VERSION=18 \
            MARKETING_VERSION=1.0.0 \
            clean archive \
            -archivePath /tmp/TradePulse.xcarchive \
            -allowProvisioningUpdates

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath /tmp/TradePulse.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath /tmp/TradePulse_export \
            -allowProvisioningUpdates

    artifacts:
      - /tmp/TradePulse_export/*.ipa
      - /tmp/TradePulse.xcarchive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true
